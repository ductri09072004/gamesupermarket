<!doctype html><html><head><base href="/"><meta charset="utf-8"><title>Đo hiệu năng Siêu nhẹ</title><style>body{margin:0}#report{position:fixed;top:8px;left:8px;max-width:94vw;max-height:85vh;overflow:auto;background:#12261de8;color:white;padding:12px;font:12px monospace;z-index:99999}</style></head><body><div id="app"></div><div id="ui-root"></div><pre id="report">Đang nạp…</pre><script type="module">
import '/src/ui/styles.css';import * as THREE from 'three';import {Game} from '/src/game/Game';import {createDevState} from '/src/core/GameState';import {perf} from '/src/engine/Perf';import {cityModel} from '/src/world/CityModels';
const report=document.querySelector('#report');const game=new Game(document.querySelector('#app'));await game.boot();
const state=createDevState(7);state.settings.quality='lite';state.minutes=12*60;state.storeOpen=true;game.startSession(state,null);document.querySelector('#ui-root').style.display='none';const world=game.current;world.player.cameraOverride=true;
if(new URLSearchParams(location.search).has('baseline')) { world.city.culling.clear(); game.r.scene.traverse(o=>{if(o.name.startsWith('products:'))o.frustumCulled=false}); }
if(!cityModel('tree_small_02')||!cityModel('vn_house_2f'))throw new Error('Benchmark requires loaded street assets');const labels=new Map();const manifest=await (await fetch('/assets/manifest.json')).json();for(const p of manifest.city){const id=p.split('/').pop().replace('.glb','');cityModel(id)?.traverse(o=>{if(o.isMesh)labels.set(o.geometry,id)})}
const cpu={};function wrap(obj,name,label){const fn=obj[name].bind(obj);obj[name]=(...args)=>{const t=performance.now();const result=fn(...args);const ms=performance.now()-t;const c=cpu[label]??={ms:0,n:0};c.ms+=ms;c.n++;return result}}
for(const key of ['products','interaction','customers','staff','physics','lighting','weather','furniture','boxes','decor','lights'])if(world[key]?.update)wrap(world[key],'update',key);
wrap(world.life,'update','cityLife');wrap(world.city,'setNight','cityMaterials');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));const results=[];
for(const [name,pos,target] of (new URLSearchParams(location.search).has('lifetimeOnly')?[]:[['store',[4,1.65,19],[1,1.2,20]],['street',[6,8,24],[48,2,22]]])){
 game.r.camera.position.set(...pos);game.r.camera.lookAt(...target);report.textContent='Làm nóng '+name;await sleep(5000);perf.reset();for(const key of Object.keys(cpu))delete cpu[key];report.textContent='Đang đo '+name;await sleep(12000);
 const frustum=new THREE.Frustum().setFromProjectionMatrix(new THREE.Matrix4().multiplyMatrices(game.r.camera.projectionMatrix,game.r.camera.matrixWorldInverse));const meshes=[];
 game.r.scene.traverseVisible(o=>{if((o.isMesh||o.isSkinnedMesh)&&frustum.intersectsObject(o)){const tris=(o.geometry.index?.count??o.geometry.attributes.position.count)/3*(o.isInstancedMesh?o.count:1);meshes.push({name:labels.get(o.geometry)||o.name||o.material?.name||o.type,triangles:Math.round(tris)})}});
 const r=perf.report(name);results.push({phase:name,env:perf.env,summary:r.summary,cpu:r.avgCpu,subsystems:Object.fromEntries(Object.entries(cpu).map(([k,v])=>[k,+(v.ms/v.n).toFixed(3)])),memory:{...game.r.renderer.info.memory},resolution:[game.r.canvas.width,game.r.canvas.height],heavy:meshes.sort((a,b)=>b.triangles-a.triangles).slice(0,10)});
}
report.textContent=JSON.stringify(results,null,2);document.title='Đo xong · Siêu nhẹ';game.loop.stop();
const controls=document.createElement('div');controls.style.cssText='position:fixed;bottom:10px;left:10px;z-index:100000;display:flex;gap:8px';document.body.append(controls);
const hide=document.createElement('button');hide.textContent='Ẩn/hiện kết quả';hide.onclick=()=>{report.style.display=report.style.display==='none'?'block':'none'};controls.append(hide);
const cycle=document.createElement('button');cycle.textContent='Kiểm tra đổi đồ họa / dựng lại phố';controls.append(cycle);
cycle.onclick=async()=>{
 cycle.disabled=true;const lifetime=[];game.loop.start();
 for(const quality of ['high','lite','medium','lite','low','lite','lite','lite']){
  report.style.display='block';report.textContent='Kiểm tra tài nguyên: '+quality;
  if(game.r.quality===quality)world.rebuildCity();else game.applySettings({...state.settings,quality});
  await sleep(2000);lifetime.push({quality,memory:{...game.r.renderer.info.memory}});
 }
 game.loop.stop();report.textContent=JSON.stringify({benchmark:results,lifetime},null,2);cycle.disabled=false;
};
</script></body></html>
